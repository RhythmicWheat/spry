<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spry</title>
<style>
:root { --page:#F5F5F2; --card:#FFFFFF; --ink:#121417; --muted:#5C6168; --brand:#1E6B52; --line:#E4E4DE; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --page:#111312; --card:#1B1E1D; --ink:#F1F2EF; --muted:#A4AAA6; --brand:#4FB38F; --line:#2B302E; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--page); color:var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 40px max(20px, env(safe-area-inset-left)) 64px; }
header { display:flex; align-items:center; gap:12px; margin-bottom: 28px; }
header a { display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; font-weight:600; font-size:20px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 4px; }
h2 { font-size: 21px; margin: 36px 0 8px; }
h3 { font-size: 17px; margin: 24px 0 6px; }
p, li { color: var(--ink); }
.muted, em { color: var(--muted); font-style: normal; }
a { color: var(--brand); }
ul { padding-left: 22px; }
li { margin: 4px 0; }
.card { background: var(--card); border-radius: 16px; padding: 20px 22px; margin: 16px 0; }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
</style>
</head>
<body><main>
<header><a href="./"><svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22.5" fill="#F5F5F2"/>
<circle cx="50" cy="50" r="27" fill="none" stroke="#E3E3DD" stroke-width="11"/>
<circle cx="50" cy="50" r="27" fill="none" stroke="#1E6B52" stroke-width="11" stroke-linecap="round" stroke-dasharray="122.1 169.6" transform="rotate(-90 50 50)"/></svg><span>Spry</span></a></header>

<h1>Spry</h1>
<p class="muted">A calm, all-in-one health tracker for workouts, food, sleep and steps. Your data stays on your phone.</p>
<div class="card">
<h3 style="margin-top:0">Support</h3>
<p>Questions, problems or ideas: <strong>spry.app.help@gmail.com</strong></p>
</div>
<p><a href="privacy.html">Privacy policy</a></p>

<footer>Spry · <a href="privacy.html">Privacy policy</a></footer>
</main></body>
</html>
